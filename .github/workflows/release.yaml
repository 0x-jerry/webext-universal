name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup bun
        uses: 0x-jerry/workflows/actions/setup-js@main
        with:
          fetch-all: true
      - name: Install dependencies
        run: bun i

      - name: Generate Chrome Extension
        run: bun run build:prepare && bun run build && bun run pack:crx
        env:
          WEBEXT_PRIVATE_KEY: ${{ secrets.WEBEXT_PRIVATE_KEY }}

      - name: Release
        id: create-release
        uses: 0x-jerry/workflows/actions/changelog@main
        with:
          files: |
            webext-universal.crx
